<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard - Carlos Adenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <h1>Weather Dashboard</h1>

        <form id="search-form">
            <input type="text" id="city-input" placeholder="Enter city name..." required>
            <button type="submit">Search</button>
        </form>

        <div id="loading" class="hidden">Loading weather data...</div>
        <div id="error" class="hidden"></div>

        <div id="weather-card" class="hidden">
            <h2 id="city-name"></h2>
            <p id="date"></p>
            <div class="temp-section">
                <img id="weather-icon" src="" alt="Weather icon">
                <span id="temperature"></span>
            </div>
            <p id="description"></p>
            <div class="details">
                <div>
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </div>
                <div>
                    <span>Wind</span>
                    <strong id="wind"></strong>
                </div>
                <div>
                    <span>Feels like</span>
                    <strong id="feels-like"></strong>
                </div>
            </div>
        </div>
    </div>

    <script src=".env"></script>
    <script src="app.js"></script>
</body>
</html>
